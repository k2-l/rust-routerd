<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050811">
<title>routerd · 智能路由遥测中枢</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="boot" class="boot">
  <div class="boot-ring"></div>
  <div class="boot-text">ROUTERD // 25.12</div>
</div>

<section id="login-view" class="login hidden">
  <div class="login-orb orb-a"></div>
  <div class="login-orb orb-b"></div>
  <div class="login-card">
    <div class="brand brand-lg">
      <span class="brand-mark" id="login-mark"></span>
      <span class="brand-name">ROUTERD <small>OS</small></span>
    </div>
    <p class="login-sub">次世代嵌入式路由核心控制台</p>
    <div class="login-device" id="login-device">正在探测硬件平台…</div>
    <form id="login-form" autocomplete="off">
      <label class="field">
        <span>管理员账号</span>
        <input name="username" value="root" autocomplete="username" spellcheck="false">
      </label>
      <label class="field">
        <span>访问密码</span>
        <input name="password" type="password" autocomplete="current-password" placeholder="请输入管理密码">
      </label>
      <div id="login-error" class="form-error hidden"></div>
      <button class="btn btn-primary btn-block" type="submit" id="login-btn">接入控制台</button>
    </form>
    <div class="login-foot">
      <span id="login-version">routerd</span>
      <span id="login-tls"></span>
    </div>
  </div>
</section>

<div id="app" class="shell hidden">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-mark" id="side-mark"></span>
      <div>
        <span class="brand-name">ROUTERD</span>
        <span class="brand-tag">CORE 25.12</span>
      </div>
    </div>
    <nav class="nav" id="nav">
      <button class="nav-item active" data-view="overview" title="系统总览"></button>
      <button class="nav-item" data-view="network" title="上网设置"></button>
      <button class="nav-item" data-view="wireless" title="无线配置"></button>
      <button class="nav-item" data-view="clients" title="终端管理"></button>
      <button class="nav-item" data-view="access" title="安全管控"></button>
      <button class="nav-item" data-view="firewall" title="端口转发"></button>
      <button class="nav-item" data-view="singbox" title="代理核心"></button>
      <button class="nav-item" data-view="system" title="系统固件"></button>
      <button class="nav-item" data-view="logs" title="内核日志"></button>
    </nav>
    <div class="sidebar-foot">
      <div class="pulse-dot"></div>
      <div class="grow" style="min-width:0">
        <div class="foot-title" id="side-host">router</div>
        <div class="foot-sub" id="side-ver">Rust Core</div>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <div class="row gap-10">
          <h1 id="view-title">系统总览</h1>
          <span class="cyber-chip" id="top-arch">AARCH64 // MUSL</span>
        </div>
        <p id="view-sub" class="view-sub">全息网络拓扑与硬件加速遥测</p>
      </div>
      <div class="top-actions">
        <div class="live-pill"><span class="pulse-dot"></span><span id="top-host">router</span></div>
        <button class="icon-btn" id="btn-refresh" title="立即刷新"></button>
        <button class="icon-btn" id="btn-logout" title="安全退出"></button>
      </div>
    </header>
    <div id="view" class="view"></div>
  </main>

  <nav class="mobile-nav" id="mobile-nav"></nav>
</div>

<div id="toast" class="toast"></div>
<div id="modal-root"></div>
<script src="/app.js"></script>
</body>
</html>
