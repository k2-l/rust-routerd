[package]
name = "routerd"
version = "1.0.0"
edition = "2021"
description = "High-performance router management daemon for OpenWrt / Cudy TR3000"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["multipart", "http2", "macros"] }
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

rand = "0.8"
time = { version = "0.3", features = ["formatting", "macros"] }
base64 = "0.22"
hex = "0.4"
sha2 = "0.10"
libc = "0.2"

rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }

rust-embed = "8"
mime_guess = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"
