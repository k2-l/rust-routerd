[package]
name = "routerd"
version = "1.0.0"
edition = "2021"
description = "High-performance router management daemon for ImmortalWrt 25.12 / Cudy TR3000"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["multipart", "http2", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }
futures-util = "0.3"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

rand = "0.8"
base64 = "0.22"
hex = "0.4"
libc = "0.2"

openssl = "0.10"
tokio-openssl = "0.6"
blake3 = "1"

rust-embed = "8"
mime_guess = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"
